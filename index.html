<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReviewDesk — アクセスコードの確認</title>
<style>
  :root{
    --bg:#141416;
    --panel:#1b1b1e;
    --panel-raised:#212124;
    --border:#2b2b2f;
    --text:#e9e7e2;
    --text-dim:#8c8c92;
    --text-faint:#5c5c62;
    --accent:#7c8cf8;
    --danger:#e0604a;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: "Inter", -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    display:flex;
    align-items:center;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .gate-box{
    width:100%;
    max-width:380px;
    padding:0 20px;
  }
  .mark{
    font-family:var(--mono);
    font-weight:700;
    font-size:18px;
    text-align:center;
    margin-bottom:6px;
  }
  .mark span{color:var(--accent);}
  .tagline{
    text-align:center;
    font-size:11px;
    color:var(--text-faint);
    letter-spacing:0.03em;
    margin-bottom:36px;
  }
  label{
    display:block;
    font-size:12px;
    color:var(--text-dim);
    margin-bottom:8px;
  }
  input[type="text"]{
    width:100%;
    background:var(--panel-raised);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:8px;
    padding:12px 14px;
    font-family:var(--mono);
    font-size:15px;
    letter-spacing:0.05em;
    outline:none;
  }
  input[type="text"]:focus{border-color:var(--accent);}
  button{
    width:100%;
    margin-top:14px;
    background:var(--accent);
    border:1px solid var(--accent);
    color:#13112c;
    font-weight:600;
    font-size:14px;
    padding:12px;
    border-radius:8px;
    cursor:pointer;
  }
  button:disabled{opacity:0.5; cursor:not-allowed;}
  .msg{
    margin-top:14px;
    font-size:12.5px;
    text-align:center;
    min-height:18px;
  }
  .msg.error{color:var(--danger);}
  .msg.info{color:var(--text-dim);}
  .buy-link{
    display:block;
    text-align:center;
    margin-top:28px;
    font-size:12px;
    color:var(--text-faint);
  }
  .buy-link a{color:var(--accent); text-decoration:none;}
  .loading{
    text-align:center;
    font-size:12.5px;
    color:var(--text-faint);
    letter-spacing:0.03em;
  }
</style>
</head>
<body>

<div class="loading" id="loadingEl">読み込んでいます…</div>

<div class="gate-box" id="gateBox" hidden>
  <div class="mark">Review<span>Desk</span></div>
  <div class="tagline">LOCAL VIDEO QC</div>

  <form id="gateForm">
    <label for="codeInput">アクセスコード</label>
    <input type="text" id="codeInput" autocomplete="off" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX" required>
    <button type="submit" id="submitBtn">確認して開く</button>
    <div class="msg" id="msgEl"></div>
  </form>

  <div class="buy-link">アクセスコードをお持ちでない方は <a href="https://timbre12.gumroad.com/l/ficar" target="_blank" rel="noopener">こちらから購入</a></div>
</div>

  const IV_B64 = "M1x6ST5RXCd0gtrn";

  const loadingEl = document.getElementById('loadingEl');
  const gateBox = document.getElementById('gateBox');
  const form = document.getElementById('gateForm');
  const codeInput = document.getElementById('codeInput');
  const submitBtn = document.getElementById('submitBtn');
  const msgEl = document.getElementById('msgEl');

  function base64ToBytes(b64){
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  function setMsg(text, type){
    msgEl.textContent = text;
    msgEl.className = 'msg' + (type ? ' ' + type : '');
  }

  async function decryptAndRender(keyB64){
    const keyBytes = base64ToBytes(keyB64);
    const ivBytes = base64ToBytes(IV_B64);
    const payloadBytes = base64ToBytes(PAYLOAD_B64);

    const cryptoKey = await crypto.subtle.importKey(
      'raw', keyBytes, { name: 'AES-GCM' }, false, ['decrypt']
    );
    const plainBuf = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: ivBytes }, cryptoKey, payloadBytes
    );
    const html = new TextDecoder().decode(plainBuf);

    // 復号したReviewDesk本体を、新しいページとして正式に読み込み直す
    // (document.write()は最近のブラウザで非同期実行時にブロックされ、
    //  元のページが残ったまま重なって表示される不具合が起きるため使用しない)
    const blob = new Blob([html], { type: 'text/html' });
    const blobUrl = URL.createObjectURL(blob);
    location.replace(blobUrl);
  }

  const STORAGE_KEY = 'reviewdesk_dk'; // この端末用に保存する復号鍵

  function showForm(){
    loadingEl.hidden = true;
    gateBox.hidden = false;
  }

  // この端末で以前に確認済みなら、サーバーに再確認しに行かず自動で開く
  // （毎回開くたびにアクセスコードの利用回数を消費してしまうのを防ぐため）
  async function tryAutoOpen(){
    let cachedKey;
    try{ cachedKey = localStorage.getItem(STORAGE_KEY); }catch(e){ showForm(); return; }

    if (!cachedKey){
      // 保存済みの鍵がなければ、すぐにログインフォームを表示する
      showForm();
      return;
    }

    try{
      await decryptAndRender(cachedKey);
      // 成功時はページごと遷移するため、ここに到達する前に画面が切り替わる
    }catch(e){
      // 保存されていた鍵が無効(ビルドが更新された等)な場合は、通常のログインへフォールバック
      try{ localStorage.removeItem(STORAGE_KEY); }catch(e2){}
      showForm();
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const code = codeInput.value.trim();
    if (!code) return;

    submitBtn.disabled = true;
    setMsg('確認しています…', 'info');

    try{
      const res = await fetch('/api/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code })
      });
      const data = await res.json();

      if (!res.ok || !data.ok){
        setMsg(data.message || 'アクセスコードが確認できませんでした。', 'error');
        submitBtn.disabled = false;
        return;
      }

      // この端末用に鍵を保存しておく(次回以降は再確認せず自動で開くため)
      try{ localStorage.setItem(STORAGE_KEY, data.key); }catch(e){ /* 保存できなくても動作は継続 */ }

      setMsg('確認できました。読み込んでいます…', 'info');
      await decryptAndRender(data.key);

    }catch(err){
      setMsg('通信エラーが発生しました。時間をおいて再度お試しください。', 'error');
      submitBtn.disabled = false;
    }
  });

  // ページ読み込み時、まず自動オープンを試す
  tryAutoOpen();
})();
